name: Build Custom Packages

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: '构建分支'
        required: true
        default: 'release-with-antigravity'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install

      # 关键：移除 tauri.conf.json 中强制要求的自动更新签名公钥和自动更新打包，避免因缺失官方私钥而构建失败
      - name: Remove signing pubkey requirement
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const file = "src-tauri/tauri.conf.json";
            const data = JSON.parse(fs.readFileSync(file, "utf8"));
            if (data.plugins && data.plugins.updater) {
              delete data.plugins.updater.pubkey;
            }
            if (data.bundle) {
              data.bundle.createUpdaterArtifacts = false;
            }
            fs.writeFileSync(file, JSON.stringify(data, null, 2));
            console.log("Successfully stripped updater signing requirement from tauri.conf.json");
          '

      - name: Build Tauri app (without updater signing)
        shell: bash
        run: |
          pnpm tauri build ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-${{ matrix.platform }}
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/msi/*.msi
          if-no-files-found: warn
